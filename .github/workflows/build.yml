name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-3ds:
    name: 3DS (.3dsx)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: ndsmusicplayer-3dsx
          path: ndsmusicplayer.3dsx

  release:
    name: Attach .3dsx to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-3ds, core-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ndsmusicplayer-3dsx
      - name: Create release (if needed) and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "NTRPlayer 3DS ${TAG#v}" --notes ""
          gh release upload "$TAG" ndsmusicplayer.3dsx -R "$GITHUB_REPOSITORY" --clobber

  core-tests:
    name: Core tests (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PC tools with sanitizers
        run: |
          cc -std=c99 -Wall -Wextra -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all \
             -Isource/core tools/render_wav.c source/core/[a-z]*.c -lm -o render_wav
          cc -std=c99 -Wall -Wextra -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all \
             -Isource/core tools/sdat_list.c source/core/[a-z]*.c -lm -o sdat_list
      - name: Render synthetic test songs
        run: |
          python3 tools/make_music_rom.py test.nds --ncsf ncsf
          ./sdat_list test.nds
          ./render_wav test.nds seq.wav -m 30
          ./render_wav test.nds strm.wav -t 0 -m 30
          ./render_wav ncsf/test.minincsf ncsf.wav
